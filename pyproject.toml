[project]
name = "linkedin-scrapper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "apify-client>=1.12.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.6.0",
    "openai>=1.90.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "pypdf>=6.0.0",
    "python-dotenv>=1.0.1",
    "resend>=2.10.0",
    "rich>=13.9.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
linkedin-scrapper = "linkedin_scrapper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_scrapper"]
